services:
  server:
    build: .
    container_name: serveresp32

    ports:
      - "${HOST_PORT:-3000}:3000"

    environment:
      TZ: "${TZ:-Europe/Rome}"
      PORT: "3000"
      DB_PATH: /data/dipendenti.db
      NAS_BASE_PATH: "${NAS_BASE_PATH:-/NAS/Cartella dipendenti/tabella presenze/Lettura NFC}"

    volumes:
      # Database host montato in sola lettura.
      - type: bind
        source: "${DB_FILE:-./data/dipendenti.db}"
        target: /data/dipendenti.db
        read_only: true

      # NAS già montato sull'host.
      - type: bind
        source: "${NAS_MOUNT:-./NAS}"
        target: /NAS
        bind:
          create_host_path: false

    restart: unless-stopped
